<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataFetching and contact list</title>
</head>
<body>
    
    <h1>contactlist</h1>

      <form id="contactForm">
 
         <label for="name">Name:</label>
        <input type="text" name="name" placeholder="Enter Name" id="name" required minlength="3">
        <br>
        <label for="phone">Phone:</label>
        <input type="text" name="name" placeholder="Enter Phone Number" id="phone" required >
 
 <br>
        <button type="submit" id="addbtn">save</button>
 
 
    </form>

     <h2>contact list</h2>
     <ul id="contactlist"></ul>

    <script>
    let contactlist=document.getElementById("contactlist") 

    let contactForm=document.getElementById("contactForm")
    
    let localcontacts=[];
    
     
    //foreach
      
     function showcontacts(contacts){
        contactlist.innerHTML="";
        localcontacts.forEach((contact)=>{
            let li=document.createElement("li")
            li.innerHTML=`${contact.name}-${contact.phone}-${contact.id} `
            contactlist.appendChild(li)
  
     // Delete button
     let deletebtn=document.createElement("button");
    deletebtn.className="deletebtn";
    deletebtn.textContent="Delete"
    li.appendChild(deletebtn)
    
    deletebtn.addEventListener("click",()=>{
        li.remove()
        
    })


        })
     }


    async function addcontacts(name,phone){
        localcontacts.push({name:name,phone:phone,id:Date.now()})
          console.log(localcontacts)
    
      showcontacts()
    }
        
    contactForm.addEventListener("submit",function(e){
        e.preventDefault();
    let name=document.getElementById("name").value;
    let phone=document.getElementById("phone").value;

    addcontacts(name,phone);
    contactForm.reset()
       
    })
            
   
    
    </script>
</body>
</html>
