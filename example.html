    // with inbuilt methods
    function reverseStringin(str) {
  return str.split('').reverse().join('');
}

// without inbuilt methods

// reverse string

function reverseString(str) {
  let reversed = '';
  for (let i = str.length - 1; i >= 0; i--) {
    reversed += str[i];
  }
  return reversed;
}
console.log(reverseString("hiii"))

// prime
function isPrime(n) {
  if (n <= 1) return false; // 0 and 1 are not prime
  if (n === 2) return true; // 2 is prime
  if (n % 2 === 0) return false; // other even numbers are not prime

  const limit = Math.sqrt(n);
  for (let i = 3; i <= limit; i += 2) {
    if (n % i === 0) return false; // found a divisor → not prime
  }

  return true; // no divisors found → prime
}
 console.log(isPrime(15))

//  max number in a array
function findLargest(arr) {
  if (arr.length === 0) {
    console.log("Array must have values");
  }
  return Math.max(...arr);
}

console.log(findLargest([1000,700,800,880000]));
