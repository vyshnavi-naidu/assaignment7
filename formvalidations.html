<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <style>
        h2{
            text-align: center;
            margin: 50px;
            padding: 10px;
            color: blue;
            } 
         
         #content{

             display: flex;
             flex-direction: column;
             align-items: center;
              } 
        .totalcontent{
                background-color: white;
            }  
        .star{
                color: red;
            }
            
        


    </style>
</head>
<body>
    <div class="totalcontent"> 
    <h2>Form Validations</h2>

    <form  id="forms" class="row g-3 needs-validation" novalidate>

  <div id="content">

    <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
        <label for="fullName" class="form-label" >Full Name<span class="star">*</span></label>
        <input type="text" class="form-control" id="fullName" required>
        </div> </div>
        
    <div class="row"> 
    <div class="col-lg-12 col-md-12 col-sm-12 ">
        <label for="email" class="form-label">Email address <span class="star">*</span></label>
        <input type="email" class="form-control" id="email" required>
        </div></div>
    
    <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
        <label for="password" class="form-label">Password <span class="star">*</span></label>
        <input type="password" class="form-control" id="password" required minlength="8">
        </div> </div>
     
    <div class="row"> 
    <div class="col-lg-12 col-md-12 col-sm-12">
        <label for="confirmPassword" class="form-label">Confirm Password <span class="star">*</span></label>
        <input type="password" class="form-control" id="confirmPassword" required>
        </div></div>
    
    <div class="row"> 
    <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="form-check">
        <label class="form-check-label" for="terms">Agree to terms and conditions <span class="star">*</span></label>
        <input class="form-check-input" type="checkbox" id="terms" required>
        <p id="message"> </p>
        </div></div> </div>
     
    <div class="row"> 
        <div class="col-lg-12 col-md-12 col-sm-12">
        <button class="btn btn-primary" type="submit" id="btn">Submit</button>
        </div></div>
</div>
</form>
    </div>


    <script>

    let form=document.getElementById("forms")
    let message=document.getElementById("message")
     
    form.addEventListener("submit",function(e){
        e.preventDefault()
        let fullname=document.getElementById("fullName").value;
        let email=document.getElementById("email").value;
        let password=document.getElementById("password").value;
        let confirmpassword=document.getElementById("confirmPassword").value;
        let terms=document.getElementById("terms").checked;
        
        if(!fullname||!email||!password||!confirmpassword){
            message.textContent="please fill the feilds"
            message.style.color="red"
            return
        }
        else if(email.length<10){
          message.textContent="please enter valid email id"
          message.style.color="red"
          return
        }
        else if(password!=confirmpassword||password<10){
            message.textContent="password and confirm password should be same"
            message.style.color="red"
            return
        }
        else if(!terms){
            message.textContent="please accept terms and conditions"
            message.style.color="red"
            return
        }
        else{
            message.textContent="form submitted successfully"
            message.style.color="green"
            return

        }

        
    })



    
    </script>
</body>
</html>
