<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h2>Calculator</h2>
  <form> 
  <label for="num1">num1:</label>
  <input type="number" id="num1" placeholder="Enter number1"><br><br>
  <label for="num2">num2:</label>
  <input type="number" id="num2" placeholder="Enter number2"><br><br>
  </form>
  <select id="operator">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
    <option value="%">%</option>
    <option value="^2">^2</option>
    <option value="^3">^3</option>
   </select>
   <br><br>
  <button id="btn">Calculate</button>
  <br><br>
  <p id="result"> Result: </p>

  <script>
    document.getElementById("btn").addEventListener("click",()=> {
      let num1 =parseFloat(document.getElementById("num1").value);
      let num2 =parseFloat(document.getElementById("num2").value);
      let operator=document.getElementById('operator').value;
      let result;

     // Using control statements(conditional)
      if (num1==NaN||num2==NaN) {
        result = "Please enter valid numbers";
      } else {
        switch (operator) {
          case '+':
            result = num1 + num2;
            console.log(num1+num2)
            break;
          case '-':
            result = num1 - num2;
            break;
          case '*':
            result = num1 * num2;
            break;
          case '/':
            if (num2 === 0) {
              result = "Cannot divide by zero";
            } else {
              result = num1 / num2;
            }
            break;
          case '%':
            result = num1 % num2;
            break;
            case '^2':
              if(num1){
                result=num1*num1
              }
              else if(num2){
                result=num2*num2
              }
              else{
                result = "Enter the number"
               }
               break;

               case '^3':
              if(num1){
                result=num1*num1*num1
              }
              else if(num2){
                result=num2*num2*num2
              }
              else {
                result ="Enter the number"
               }
        default:
          result = "Invalid operation";
      }
      }

      document.getElementById("result").innerText= "Result:"+result;
    });
  </script>
    
</body>
</html>
